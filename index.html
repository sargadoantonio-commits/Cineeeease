<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SeatSwift: Cinema Booking Prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#1b1b1f;--mut:#5f6368;--line:#c9ccd1;--ink:#1b1b1f;--onink:#fff;--soft:#e4e6ea;--ok:#cdeed3;--warn:#ffefc4;--acc:#cfe3fb;--link:#1a4fb8;color-scheme:light;font-size:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101114;--card:#1a1c20;--tx:#f0f1f3;--mut:#a3a8b0;--line:#3a3d44;--ink:#f0f1f3;--onink:#101114;--soft:#2a2d33;--ok:#1f4a2b;--warn:#4d3f12;--acc:#1e3f66;--link:#8db4ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101114;--card:#1a1c20;--tx:#f0f1f3;--mut:#a3a8b0;--line:#3a3d44;--ink:#f0f1f3;--onink:#101114;--soft:#2a2d33;--ok:#1f4a2b;--warn:#4d3f12;--acc:#1e3f66;--link:#8db4ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.app{width:100%;max-width:430px;min-height:100%;background:var(--card);display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--soft);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:1.25rem;margin:0;flex:1}
.ib{min-width:48px;min-height:48px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--tx);font-weight:700;font-size:1rem;cursor:pointer}
main{flex:1;padding:14px}
.btn{width:100%;min-height:56px;border:0;border-radius:12px;background:var(--ink);color:var(--onink);font-size:1.1rem;font-weight:700;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--soft);color:var(--tx);margin-top:10px}
.step{font-weight:700;font-size:.95rem;margin:0 0 8px}
.chip{display:inline-block;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:.95rem}
.movie{border:2px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;display:flex;flex-wrap:wrap;gap:12px}
.poster{width:96px;height:130px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.85rem}
.movie h2{margin:0 0 4px;font-size:1.15rem}.movie p{margin:0;color:var(--mut);font-size:.9rem}
.times{display:flex;gap:8px;width:100%}
.times button{flex:1;min-height:52px;border:0;border-radius:10px;background:var(--ink);color:var(--onink);font-weight:700;font-size:1rem;cursor:pointer}
.timer{display:flex;align-items:center;justify-content:space-between;background:var(--warn);border-radius:12px;padding:8px 8px 8px 14px;font-weight:700;margin-bottom:10px}
.timer button{min-height:44px;padding:0 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--tx);font-weight:700;cursor:pointer}
.screen{background:var(--soft);text-align:center;border-radius:8px;padding:6px;margin:8px 36px;font-size:.8rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:auto repeat(8,1fr);gap:6px;align-items:center;margin:10px 0}
.rl{font-weight:700;font-size:.85rem;color:var(--mut);width:16px}
.seat{aspect-ratio:1/1;min-height:40px;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--tx);font-weight:700;font-size:.95rem;cursor:pointer;padding:0}
.seat.t{background:var(--soft);color:var(--mut);border-color:var(--line);cursor:not-allowed}
.seat.s{background:var(--ink);color:var(--onink)}
.seat.a{background:var(--acc)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;margin:6px 0 12px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:20px;height:20px;border:2px solid var(--ink);border-radius:5px;display:inline-block;font-style:normal;font-size:.7rem;text-align:center;line-height:16px}
.sum{background:var(--soft);border-radius:12px;padding:12px;margin-bottom:10px;font-size:.95rem;line-height:1.5}
.sum b{font-size:1.05rem}
.warn{background:var(--warn);border-radius:10px;padding:10px;margin-bottom:10px;font-size:.9rem}
.ok{width:84px;height:84px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;margin:6px auto}
.tk{border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center;margin:12px 0}
.qr{display:grid;grid-template-columns:repeat(11,1fr);width:150px;margin:0 auto 10px;border:3px solid var(--ink);padding:4px;background:#fff}
.qr i{aspect-ratio:1/1}.qr i.k{background:#111}
.tk p{margin:4px 0}
nav{display:flex;border-top:2px solid var(--line);position:sticky;bottom:0;background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--tx);font-size:.95rem;cursor:pointer}
nav button.on{font-weight:700}
a.l,button.l{color:var(--link);background:none;border:0;font-size:1rem;cursor:pointer;padding:12px 0;text-decoration:underline}
.c{text-align:center}
.help{background:var(--soft);border-radius:12px;padding:14px;line-height:1.5;margin:12px 0}
:root{--bg:#e9edf3;--card:#fff;--tx:#14213d;--mut:#5a6577;--line:#d5dbe5;--ink:#14213d;--ink2:#2a4478;--onink:#fff;--soft:#eef1f6;--ok:#d9f2e0;--warn:#fff1cf;--acc:#d7e6fb;--link:#1d4ed8;--gold:#b8892b;--hd1:#14213d;--hd2:#2a4478}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#121a2b;--tx:#eef2fa;--mut:#9fb0c8;--line:#26334d;--ink:#e3b95f;--ink2:#c99a3b;--onink:#101826;--soft:#1b2740;--ok:#17402b;--warn:#4a3b12;--acc:#23406b;--link:#8db4ff;--gold:#e3b95f;--hd1:#0d1626;--hd2:#1b2a47}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#121a2b;--tx:#eef2fa;--mut:#9fb0c8;--line:#26334d;--ink:#e3b95f;--ink2:#c99a3b;--onink:#101826;--soft:#1b2740;--ok:#17402b;--warn:#4a3b12;--acc:#23406b;--link:#8db4ff;--gold:#e3b95f;--hd1:#0d1626;--hd2:#1b2a47}
.app{border:0;box-shadow:0 10px 40px rgba(20,33,61,.2)}
header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:14px 16px}
header h1{font-family:Georgia,'Times New Roman',serif;letter-spacing:.05em;font-weight:700}
.ib{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.btn,.times button{background:linear-gradient(135deg,var(--ink),var(--ink2));box-shadow:0 4px 12px rgba(20,33,61,.22);letter-spacing:.02em}
.btn.sec{background:var(--soft);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border-radius:16px;padding:18px;margin-bottom:8px}
.hero h2{font-family:Georgia,'Times New Roman',serif;font-size:1.35rem;margin:0 0 6px}
.hero p{margin:0;font-size:.95rem;line-height:1.5;opacity:.92}
.prog{display:flex;gap:6px;margin:0 0 12px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--gold)}
.step{color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
.movie{border:1px solid var(--line);box-shadow:0 2px 10px rgba(20,33,61,.08)}
.poster{background:linear-gradient(160deg,var(--hd2),var(--hd1));color:#e8c37a;font-family:Georgia,serif;letter-spacing:.05em}
.chip{border:1px solid var(--line)}
.timer{border:1px solid var(--gold)}
.sum{border:1px solid var(--line)}
.tk{border:1px solid var(--line);border-top:6px solid var(--gold);box-shadow:0 6px 20px rgba(20,33,61,.12)}
.ok{border:3px solid #2f9e5b}
nav{box-shadow:0 -2px 10px rgba(20,33,61,.08)}
nav button.on{border-top:3px solid var(--gold);color:var(--tx)}
.foot{text-align:center;color:var(--mut);font-size:.8rem;margin:14px 0 4px}
</style>
</head>
<body>
<div class="app">
<header><h1 id="ttl">SeatSwift</h1><button class="ib" id="back" aria-label="Back" hidden>&lt;</button><button class="ib" id="tx" aria-label="Change text size">A+</button><button class="ib" id="hp" aria-label="Help">?</button></header>
<main id="m"></main>
<nav><button id="n1" class="on">Movies</button><button id="n2">My Tickets</button><button id="n3">Help</button></nav>
</div>
<script>
var movies=[{t:"Movie Title A",d:"2 hr 05 min · PG"},{t:"Movie Title B",d:"1 hr 50 min · PG-13"}];
var taken={"A-2":1,"B-6":1,"B-7":1,"D-1":1,"D-2":1,"E-5":1,"F-3":1,"F-4":1};
var rows="ABCDEF".split(""),price=250,fee=20,max=6;
var st={v:"home",mv:null,time:null,sel:[],left:480,ticket:null,sz:0},iv=null;
var m=document.getElementById("m"),ttl=document.getElementById("ttl"),back=document.getElementById("back");
function money(n){return "PHP "+n.toLocaleString("en-US")}
function seatId(r,c){return rows[r]+"-"+(c+1)}
function isolated(){var out=[];for(var r=0;r<6;r++){for(var c=0;c<8;c++){var id=seatId(r,c);if(taken[id]||st.sel.indexOf(id)>-1)continue;var L=c===0?"w":(taken[seatId(r,c-1)]?"t":(st.sel.indexOf(seatId(r,c-1))>-1?"s":"f"));var R=c===7?"w":(taken[seatId(r,c+1)]?"t":(st.sel.indexOf(seatId(r,c+1))>-1?"s":"f"));if(L!=="f"&&R!=="f"&&(L==="s"||R==="s"))out.push(id)}}return out}
function startTimer(){clearInterval(iv);iv=setInterval(function(){st.left--;var e=document.getElementById("tm");if(st.left<=0){clearInterval(iv);st.sel=[];st.left=480;go("seats");alert("Your seats were released. We’ve reset the timer so you can pick again.");return}if(e)e.textContent=fmt(st.left)},1000)}
function fmt(s){var a=Math.floor(s/60),b=s%60;return (a<10?"0":"")+a+":"+(b<10?"0":"")+b}
function prog(n){return '<div class="prog" aria-hidden="true">'+[1,2,3].map(function(i){return '<i class="'+(i<=n?'on':'')+'"></i>'}).join('')+'</div>'}
function go(v){st.v=v;render()}
function render(){
 back.hidden=(st.v==="home");
 document.getElementById("n1").className=(st.v==="tickets"||st.v==="help")?"":"on";
 document.getElementById("n2").className=st.v==="tickets"?"on":"";
 document.getElementById("n3").className=st.v==="help"?"on":"";
 var h="";
 if(st.v==="home"){ttl.textContent="SeatSwift";
  h='<div class="hero"><h2>Reserve your seats in three simple steps</h2><p>Select a film, choose your seats, and receive your e-ticket instantly.</p></div>'+prog(1)+'<p class="step">Step 1 of 3: Choose a film and showtime</p><span class="chip">Nearest cinema</span><h2 style="margin:16px 0 0;font-size:1.3rem">Now Showing</h2>';
  movies.forEach(function(x,i){h+='<div class="movie"><div class="poster">Poster</div><div><h2>'+x.t+'</h2><p>'+x.d+'</p></div><div class="times">'+["4:30 PM","7:00 PM","9:30 PM"].map(function(t){return '<button data-mv="'+i+'" data-t="'+t+'">'+t+'</button>'}).join("")+'</div></div>'});
 }
 if(st.v==="seats"){ttl.textContent="Pick Seats";
  var n=st.sel.length,sub=n*price,fe=n*fee,iso=isolated();
  h=prog(2)+'<p class="step">Step 2 of 3 · '+movies[st.mv].t+', '+st.time+'</p><div class="timer"><span>Seats held for <span id="tm">'+fmt(st.left)+'</span></span><button id="ext">+ 5 min</button></div><div class="screen">SCREEN</div><div class="grid" role="group" aria-label="Seat map">';
  for(var r=0;r<6;r++){h+='<span class="rl">'+rows[r]+'</span>';for(var c=0;c<8;c++){var id=seatId(r,c),cl="seat",lb=id;if(taken[id]){cl+=" t";lb+=", taken"}else if(st.sel.indexOf(id)>-1){cl+=" s";lb+=", yours"}else if(r===5&&c===7){cl+=" a";lb+=", accessible seat"}
   h+='<button class="'+cl+'" data-s="'+id+'" aria-label="'+lb+'"'+(taken[id]?' disabled':'')+'>'+(taken[id]?"×":(st.sel.indexOf(id)>-1?"✓":(r===5&&c===7?"W":"")))+'</button>'}}
  h+='</div><div class="legend"><span><i></i>Free</span><span><i style="background:var(--soft)">×</i>Taken</span><span><i style="background:var(--ink);color:var(--onink)">✓</i>Yours</span><span><i style="background:var(--acc)">W</i>Accessible</span></div>';
  if(iso.length)h+='<div class="warn">Heads up: seat '+iso.join(", ")+' would be left alone between other seats. Try moving your selection by one seat.</div>';
  h+='<div class="sum"><b>'+(n?n+" seat"+(n>1?"s":"")+": "+st.sel.join(", "):"No seats chosen yet")+'</b><br>Tickets '+money(sub)+'<br>Booking fee '+money(fe)+' (PHP '+fee+' per ticket)<br><b>Total '+money(sub+fe)+'</b></div><button class="btn" id="pay"'+(n?'':' disabled')+'>Continue to Pay</button>';
 }
 if(st.v==="pay"){ttl.textContent="Pay now";
  var n2=st.sel.length,tot=n2*(price+fee);
  h=prog(3)+'<p class="step">Step 3 of 3: Review and pay</p><div class="sum"><b>'+movies[st.mv].t+' · '+st.time+'</b><br>Seats: '+st.sel.join(", ")+'<br>Tickets '+money(n2*price)+'<br>Booking fee '+money(n2*fee)+'<br><b>Total '+money(tot)+'</b></div><p>Pay with</p><div class="sum">Saved e-wallet (demo)</div><button class="btn" id="conf">Pay '+money(tot)+'</button><button class="btn sec" id="edit">Edit seats</button><p class="c" style="color:var(--mut);font-size:.85rem">This is a prototype. No payment is made.</p>';
 }
 if(st.v==="done"||st.v==="tickets"){ttl.textContent=st.v==="done"?"Booking":"My Tickets";
  if(!st.ticket){h='<div class="help">You have no tickets yet. Pick a movie to start.</div><button class="btn" id="gohome">Browse movies</button>'}
  else{var t=st.ticket,q="";for(var i=0;i<121;i++){q+='<i'+(((i*7+i*i*3)%5<2)||i%11===0&&i<44?' class="k"':'')+'></i>'}
   h=(st.v==="done"?'<div class="ok" aria-hidden="true">✓</div><h2 class="c" style="margin:6px 0">You’re booked!</h2>':'')+'<div class="tk"><div class="qr" role="img" aria-label="QR ticket">'+q+'</div><p><b>'+t.mv+' · '+t.time+'</b></p><p>Seats: '+t.seats+'</p><p>Total paid: '+t.total+'</p><p>Ref no.: '+t.ref+'</p></div><button class="btn" onclick="alert(\'Prototype: this would add the ticket to your phone wallet.\')">Add to Wallet</button><button class="btn sec" onclick="alert(\'Prototype: this would open your share options.\')">Share with friends</button><div class="c"><button class="l" id="hp2">Need help?</button></div>'}
 }
 if(st.v==="help"){ttl.textContent="Help";
  h='<div class="help"><b>How booking works</b><br>1. Tap a showtime.<br>2. Tap seats on the map. Your seats are held for a few minutes, and you can add more time with “+ 5 min”.<br>3. Check the total, which already includes fees, then pay. Your QR ticket appears right away.</div><div class="help"><b>Reading the seat map</b><br>× means taken, ✓ means yours, W is an accessible seat. Use A+ at the top to make text bigger.</div><button class="btn" id="gohome">Back to movies</button>';
 }
 m.innerHTML=h+'<p class="foot">SeatSwift is a design prototype for an HCI course project.</p>';window.scrollTo(0,0);
}
m.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.mv!==undefined){st.mv=+b.dataset.mv;st.time=b.dataset.t;st.sel=[];st.left=480;go("seats");startTimer()}
 else if(b.dataset.s){var id=b.dataset.s,i=st.sel.indexOf(id);if(i>-1)st.sel.splice(i,1);else if(st.sel.length<max)st.sel.push(id);else alert("You can book up to "+max+" seats at a time.");render()}
 else if(b.id==="ext"){st.left+=300;document.getElementById("tm").textContent=fmt(st.left)}
 else if(b.id==="pay"){go("pay")}
 else if(b.id==="edit"){go("seats")}
 else if(b.id==="conf"){clearInterval(iv);st.ticket={mv:movies[st.mv].t,time:st.time,seats:st.sel.join(", "),total:money(st.sel.length*(price+fee)),ref:"ST-"+(4000+Math.floor(Math.random()*5000))};go("done")}
 else if(b.id==="gohome"){go("home")}
 else if(b.id==="hp2"){go("help")}
});
back.onclick=function(){if(st.v==="seats"){clearInterval(iv);go("home")}else if(st.v==="pay")go("seats");else go("home")};
document.getElementById("n1").onclick=function(){go("home")};
document.getElementById("n2").onclick=function(){go("tickets")};
document.getElementById("n3").onclick=document.getElementById("hp").onclick=function(){go("help")};
document.getElementById("tx").onclick=function(){st.sz=(st.sz+1)%3;document.documentElement.style.fontSize=[16,19,22][st.sz]+"px"};
render();
</script>
</body>
</html>
